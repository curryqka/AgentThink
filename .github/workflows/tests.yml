name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Lint (undefined names / syntax)
        run: |
          pip install ruff
          ruff check evaluation Inference scripts tests training --select F,E9
